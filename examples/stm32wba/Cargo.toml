[package]
edition = "2021"
name = "lr1110-stm32wba-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# STM32WBA65RI with LR1110 external radio
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", features = [
    "defmt",
    "stm32wba65ri",
    "time-driver-any",
    "memory-x",
    "exti",
] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", features = ["defmt"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy" }

# LR1110 support from lora-phy
lora-phy = { git = "https://github.com/lora-rs/lora-rs", features = ["defmt-03"] }

# LR1110 extended features
lr1110-rs = { path = "../..", features = ["defmt-03", "system", "gnss", "wifi", "bootloader", "lr_fhss", "regmem", "ranging", "irq-manager"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"
embedded-hal = { version = "1.0.0" }
embedded-hal-async = { version = "1.0.0" }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
heapless = { version = "0.8", default-features = false }
libm = "0.2"

[features]
default = []
# Enable subordinate mode for ranging demo
subordinate = []

[profile.release]
debug = 2
